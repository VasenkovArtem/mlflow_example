# Совпадает с run slice_model_gradient_boosting (лучший roc_auc)
params:
  model_type: gradient_boosting
  logistic_regression:
    penalty: l2
    C: 0.9
    solver: lbfgs
    max_iter: 1000
  decision_tree:
    max_depth: 8
    min_samples_split: 4
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 2
  gradient_boosting:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
  xgboost:
    n_estimators: 80
    max_depth: 5
    learning_rate: 0.1
